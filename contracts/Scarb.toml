[package]
name = "sp1_app"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.21.0"

[dev-dependencies]
sp1_verifier_bn254 = { path = "verifier" }
snforge_std = "0.64.1"
assert_macros = "2.21.0"
garaga = { git = "https://github.com/keep-starknet-strange/garaga.git", rev = "db69575e8c78d4a1b76e06cbbb00ccd66fbdb1b5" }

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[cairo]
sierra-replace-ids = false
inlining-strategy = 2

[target-defaults.test]
build-external-contracts = ["sp1_verifier_bn254::groth16_verifier::SP1Groth16VerifierBN254", "garaga::universal_ecip::UniversalECIP"]
