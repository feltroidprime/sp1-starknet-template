name: SP1 receipt and guest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Receipt and guest
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 4
      SP1_PROVER: cpu
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          prefix-key: sp1-ci-v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Guest execution, key binding, SDK receipt, and Garaga calldata
        run: cargo test --profile ci --locked -p fibonacci-lib -p fibonacci-script --lib -- --nocapture
      - name: Clippy and optional network client without credentials
        run: cargo clippy --profile ci --locked --workspace --exclude fibonacci-program --all-features --all-targets
